services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_uploads:/app/uploads
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - internal
      - edge

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - backup
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    volumes:
      - backend_backups:/backups
    command: >
      sh -c 'mkdir -p /backups &&
      while true; do
        ts=$$(date +%Y%m%d_%H%M%S);
        echo "[$$(date -Iseconds)] creando backup /backups/$${POSTGRES_DB}_$${ts}.sql.gz";
        PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" | gzip > "/backups/$${POSTGRES_DB}_$${ts}.sql.gz";
        find /backups -name "*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS:-30} -delete;
        sleep $${BACKUP_INTERVAL_SECONDS:-86400};
      done'
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles:
      - monitoring
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.1.5
    restart: unless-stopped
    profiles:
      - monitoring
    env_file:
      - ${PROD_ENV_FILE:-./.env.prod}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    profiles:
      - monitoring
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - internal

volumes:
  postgres_data:
  backend_logs:
  backend_backups:
  backend_uploads:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
