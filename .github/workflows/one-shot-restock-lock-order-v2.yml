name: One-shot restock lock-order patch v2

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply purchase receipt lock-order patch
        run: python .github/patch_restocks_purchase_lock_order.py
      - name: Commit patch and remove temporary helpers
        run: |
          rm .github/patch_restocks_purchase_lock_order.py
          rm .github/workflows/one-shot-restock-lock-order-v2.yml
          git config user.name 'SoftMobile Integrity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/routers/multistore_control.py .github/patch_restocks_purchase_lock_order.py .github/workflows/one-shot-restock-lock-order-v2.yml
          git commit -m 'fix: align purchase receipt lock ordering'
          git push origin HEAD:fix/restock-concurrency-integrity
