name: PR110 apply stock lock fix

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Apply targeted restock fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/products.py')
          text = path.read_text(encoding='utf-8')
          function_marker = 'def restock_product('
          start_marker = '    stock = db.query(Stock).filter(\n'
          end_marker = '    costo_anterior = Decimal(product.costo or 0)\n'

          function_start = text.index(function_marker)
          try:
              start = text.index(start_marker, function_start)
          except ValueError:
              if '    locked_stocks = (\n' in text[function_start:]:
                  print('Targeted fix already present.')
                  raise SystemExit(0)
              raise SystemExit('Target Stock-read marker not found; refusing unrelated changes.')

          try:
              end = text.index(end_marker, start)
          except ValueError:
              raise SystemExit('Target cost marker not found; refusing unrelated changes.')

          new_lines = [
              '    locked_stocks = (',
              '        db.query(Stock)',
              '        .filter(Stock.product_id == product_id)',
              '        .order_by(Stock.location_id.asc(), Stock.id.asc())',
              '        .with_for_update()',
              '        .all()',
              '    )',
              '    stock = next(',
              '        (',
              '            stock_item',
              '            for stock_item in locked_stocks',
              '            if stock_item.location_id == payload.location_id',
              '        ),',
              '        None,',
              '    )',
              '',
              '    stock_total_anterior = sum(',
              '        int(stock_item.cantidad_disponible or 0) for stock_item in locked_stocks',
              '    )',
          ]
          replacement = '\n'.join(new_lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Applied targeted Stock locking fix.')
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/products.py
          git commit -m "fix: lock stock before restock calculations"
          git push origin HEAD:fix/restock-concurrency-integrity
