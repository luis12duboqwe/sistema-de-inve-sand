name: Apply pre-production maintenance

on:
  push:
    branches:
      - refactor/preproduction-maintainability
    paths:
      - .github/scripts/apply_preproduction_maintenance.py
      - .github/workflows/apply-preproduction-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/preproduction-maintainability
          fetch-depth: 0
      - name: Apply exact-match maintenance transformations
        run: python .github/scripts/apply_preproduction_maintenance.py
      - name: Validate patch
        run: git diff --check
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo "No source changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/DailyCloseDialog.tsx backend/app/routers/ai_intelligence.py
          git commit -m "Apply safe pre-production maintainability refactor"
          git push origin HEAD:refactor/preproduction-maintainability
