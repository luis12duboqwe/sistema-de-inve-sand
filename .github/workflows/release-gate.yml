name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_release
          POSTGRES_USER: inventory_release
          POSTGRES_PASSWORD: inventory_release_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_release -d inventory_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      ENVIRONMENT: testing
      DEBUG: 'true'
      DATABASE_URL: postgresql+psycopg2://inventory_release:inventory_release_password@127.0.0.1:5432/inventory_release
      ALLOWED_HOSTS: '*'
      CORS_ORIGINS: http://testserver,http://127.0.0.1
      SENTRY_DISABLED: 'true'
      ENABLE_AI_FEATURES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
      - name: Frontend lint and build
        run: |
          npm run lint
          npm run build
      - name: Frontend tests
        run: npm run test:coverage
      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Backend tests on PostgreSQL
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing -ra
      - name: Runtime and business E2E tests
        run: |
          pytest -q tests/test_health_endpoints.py
          pytest -q tests/e2e/test_runtime_e2e.py tests/e2e/test_business_flows_e2e.py
          pytest -q tests/e2e/test_postgres_runtime_e2e.py

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependency audit npm
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
      - name: Dependency audit python
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  deploy-readiness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic production env
        run: |
          APP_DOMAIN=inventory.example.org ./deploy/prepare-prod-env.sh ./deploy/.env.prod.ci
          sed -i 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=test-key/' ./deploy/.env.prod.ci
          sed -i 's/^ALERT_WEBHOOK_URL=.*/ALERT_WEBHOOK_URL=https:\/\/hooks.example.org/' ./deploy/.env.prod.ci
          sed -i 's/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=StrongPassw0rd!/' ./deploy/.env.prod.ci
          sed -i 's/^SETUP_TOKEN=.*/SETUP_TOKEN=StrongSetupTokenForReleaseGate123456/' ./deploy/.env.prod.ci
          sed -i 's/^DESTRUCTIVE_OPERATION_TOKEN=.*/DESTRUCTIVE_OPERATION_TOKEN=StrongDestructiveTokenForGate123/' ./deploy/.env.prod.ci
          sed -i 's|^BACKUP_RCLONE_DESTINATION=.*|BACKUP_RCLONE_DESTINATION=offsite:inventory-ci|' ./deploy/.env.prod.ci
      - name: Validate production config
        run: |
          ./deploy/validate-prod.sh ./deploy/.env.prod.ci
          PROD_ENV_FILE=./deploy/.env.prod.ci docker compose \
            --env-file ./deploy/.env.prod.ci \
            -f ./deploy/docker-compose.prod.yml \
            --profile backup \
            --profile backup-offsite \
            --profile monitoring \
            config --quiet
