name: Reapply product SKU race fix

on:
  push:
    branches:
      - fix/product-update-sku-race-integrity

permissions:
  contents: write

jobs:
  reapply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reapply reviewed SKU race fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/products.py')
          text = path.read_text()
          old = '''    try:\n        db.commit()\n        db.refresh(product)\n        return _serialize_product(product)\n    except Exception as e:\n        db.rollback()\n        raise HTTPException(status_code=500, detail=f"Error al actualizar producto: {str(e)}")\n'''
          new = '''    try:\n        db.commit()\n        db.refresh(product)\n        return _serialize_product(product)\n    except IntegrityError:\n        db.rollback()\n        if updates.sku is not None:\n            conflicting_sku = db.query(Product).filter(\n                Product.sku == updates.sku,\n                Product.id != product_id,\n            ).first()\n            if conflicting_sku is not None:\n                raise HTTPException(\n                    status_code=400,\n                    detail=f"Ya existe otro producto con el SKU '{updates.sku}'",\n                )\n        raise HTTPException(\n            status_code=409,\n            detail="Conflicto de integridad al actualizar el producto. Reintente la operación.",\n        )\n    except Exception as e:\n        db.rollback()\n        raise HTTPException(status_code=500, detail=f"Error al actualizar producto: {str(e)}")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one update_product block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test = Path('backend/tests/test_product_update_sku_concurrency_integrity.py')
          test.write_text('''from concurrent.futures import ThreadPoolExecutor\nfrom threading import Barrier\nfrom uuid import uuid4\n\nfrom fastapi import HTTPException\nfrom sqlalchemy.orm import Session, sessionmaker\n\nfrom app.models import Product\nfrom app.routers import products\nfrom app.schemas import ProductUpdate\n\n\ndef _product(db_session: Session, *, sku: str, name: str) -> Product:\n    product = Product(\n        sku=sku,\n        nombre=name,\n        categoria="accesorio",\n        marca="Marca QA",\n        modelo=f"Modelo-{uuid4().hex[:8]}",\n        condicion="nuevo",\n        precio=100,\n        costo=50,\n        moneda="Lps",\n        garantia_meses=0,\n        activo=True,\n        is_serialized=False,\n    )\n    db_session.add(product)\n    db_session.commit()\n    db_session.refresh(product)\n    return product\n\n\ndef test_concurrent_product_updates_report_duplicate_sku_instead_of_500(\n    db_session: Session,\n) -> None:\n    suffix = uuid4().hex\n    first = _product(db_session, sku=f"SKU-A-{suffix}", name=f"Producto A {suffix}")\n    second = _product(db_session, sku=f"SKU-B-{suffix}", name=f"Producto B {suffix}")\n    first_id = int(first.id)\n    second_id = int(second.id)\n    target_sku = f"SKU-RACE-{suffix}"\n\n    bind = db_session.get_bind()\n    barrier = Barrier(2)\n\n    class BarrierSession(Session):\n        def commit(self):\n            barrier.wait(timeout=10)\n            return super().commit()\n\n    SessionLocal = sessionmaker(\n        autocommit=False,\n        autoflush=False,\n        bind=bind,\n        class_=BarrierSession,\n    )\n\n    def update(product_id: int):\n        session = SessionLocal()\n        try:\n            try:\n                updated = products.update_product(\n                    product_id,\n                    ProductUpdate(sku=target_sku),\n                    session,\n                )\n                return (200, updated.sku)\n            except HTTPException as exc:\n                return (exc.status_code, str(exc.detail))\n        finally:\n            session.close()\n\n    with ThreadPoolExecutor(max_workers=2) as pool:\n        results = list(pool.map(update, (first_id, second_id)))\n\n    assert sorted(status for status, _ in results) == [200, 400]\n    assert any(\n        target_sku in detail and "SKU" in detail\n        for status, detail in results\n        if status == 400\n    )\n\n    db_session.expire_all()\n    assert db_session.query(Product).filter(Product.sku == target_sku).count() == 1\n    assert db_session.query(Product).filter(Product.id.in_([first_id, second_id])).count() == 2\n''')
          PY
      - name: Commit reapplied change
        shell: bash
        run: |
          rm .github/workflows/reapply-product-update-sku-race.yml
          git config user.name "SoftMobile Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/products.py backend/tests/test_product_update_sku_concurrency_integrity.py .github/workflows/reapply-product-update-sku-race.yml
          git commit -m "fix: reapply concurrent product SKU conflict handling"
          git push
