name: PR110 close order cascade purge barrier

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Extend purge barrier and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('backend/app/routers/super_admin.py')
          text = router.read_text(encoding='utf-8')
          old = '''_PRODUCT_PURGE_WRITE_TABLES = (\n    "customers",\n    "imei_history",\n'''
          new = '''_PRODUCT_PURGE_WRITE_TABLES = (\n    "customers",\n    "imei_history",\n    "interaction_logs",\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '    "interaction_logs",\n' not in text:
              raise SystemExit('interaction_logs barrier marker not found')

          old = '''    "stock_history",\n    "stock_transfers",\n)\n'''
          new = '''    "stock_history",\n    "stock_transfers",\n    "trade_ins",\n)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '    "trade_ins",\n' not in text:
              raise SystemExit('trade_ins barrier marker not found')
          router.write_text(text, encoding='utf-8')

          test_path = Path('backend/tests/test_product_purge_lock_order_integrity.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('from sqlalchemy import event\n', 'from sqlalchemy import event, text\n', 1)

          test_block = r'''


def test_purge_barrier_covers_indirect_order_cascade_tables(db_session: Session) -> None:
    product, _, _ = _product_and_locations(db_session)
    product_id = int(product.id)
    db_session.commit()

    bind, SessionLocal = _session_factory(db_session)
    if bind.dialect.name != "postgresql":
        return

    for table_name in ("trade_ins", "interaction_logs"):
        holder = SessionLocal()
        purge_session = SessionLocal()
        try:
            # ROW EXCLUSIVE represents an active writer. Purge's EXCLUSIVE NOWAIT
            # barrier must include these indirectly mutated Order-cascade tables.
            holder.execute(text(f'LOCK TABLE "{table_name}" IN ROW EXCLUSIVE MODE'))
            status, _ = _purge(purge_session, product_id)
            assert status == 409, f"purge barrier omitted {table_name}"
        finally:
            purge_session.rollback()
            holder.rollback()
            purge_session.close()
            holder.close()

    db_session.expire_all()
    assert db_session.get(Product, product_id) is not None
'''
          if 'def test_purge_barrier_covers_indirect_order_cascade_tables' not in tests:
              tests += test_block
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate syntax
        shell: bash
        run: |
          python -m compileall -q backend/app/routers/super_admin.py backend/tests/test_product_purge_lock_order_integrity.py
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SoftMobile"
          git config user.email "12luisdubon@gmail.com"
          git rm .github/workflows/pr110-close-order-cascade-barrier.yml
          git add backend/app/routers/super_admin.py backend/tests/test_product_purge_lock_order_integrity.py
          git commit -m "fix: cover order cascades in purge barrier"
          git push origin HEAD:fix/restock-concurrency-integrity
