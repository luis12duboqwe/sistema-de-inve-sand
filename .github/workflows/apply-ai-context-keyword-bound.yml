name: Apply AI context keyword bound

on:
  push:
    branches:
      - fix/ai-context-keyword-bound

permissions:
  contents: write

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/ai-context-keyword-bound
          fetch-depth: 0

      - name: Apply surgical runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/ai_intelligence.py")
          text = path.read_text()

          old_import = "from app.ai_context_search import ilike_contains_literal"
          new_import = "from app.ai_context_search import bound_ai_context_sql_keywords, ilike_contains_literal"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one AI context import, found {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_inventory = "keywords = [w.lower() for w in search_message.split() if len(w) >= 2 and w.lower() not in stop_words]"
          new_inventory = "keywords = bound_ai_context_sql_keywords([w.lower() for w in search_message.split() if len(w) >= 2 and w.lower() not in stop_words])"
          if text.count(old_inventory) != 1:
              raise SystemExit(f"expected one inventory keyword assignment, found {text.count(old_inventory)}")
          text = text.replace(old_inventory, new_inventory, 1)

          old_faq = "keywords = [w.lower() for w in request.message_content.split() if len(w) > 3]"
          new_faq = "keywords = bound_ai_context_sql_keywords([w.lower() for w in request.message_content.split() if len(w) > 3])"
          if text.count(old_faq) != 1:
              raise SystemExit(f"expected one FAQ keyword assignment, found {text.count(old_faq)}")
          text = text.replace(old_faq, new_faq, 1)

          if text.count("bound_ai_context_sql_keywords(") != 2:
              raise SystemExit("runtime keyword-bound call count guard failed")
          path.write_text(text)
          PY
          python -m compileall -q backend/app/ai_context_search.py backend/app/routers/ai_intelligence.py backend/tests/test_ai_context_keyword_bound.py
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-ai-context-keyword-bound.yml
          git config user.name 'SoftMobile Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/routers/ai_intelligence.py .github/workflows/apply-ai-context-keyword-bound.yml
          git diff --cached --check
          git commit -m 'fix: wire AI context SQL keyword bound'
          git push origin HEAD:fix/ai-context-keyword-bound
