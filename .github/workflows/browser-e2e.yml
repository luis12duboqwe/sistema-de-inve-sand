name: Browser E2E

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_browser_e2e
          POSTGRES_USER: inventory_browser_e2e
          POSTGRES_PASSWORD: inventory_browser_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_browser_e2e -d inventory_browser_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      ENVIRONMENT: testing
      DEBUG: 'true'
      DATABASE_URL: postgresql+psycopg2://inventory_browser_e2e:inventory_browser_e2e_password@127.0.0.1:5432/inventory_browser_e2e
      ALLOWED_HOSTS: '*'
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      SENTRY_DISABLED: 'true'
      ENABLE_AI_FEATURES: 'false'
      E2E_DISABLE_RATE_LIMITS: 'true'
      E2E_FRONTEND_URL: http://127.0.0.1:5174
      E2E_API_URL: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install frontend and browser dependencies
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > /tmp/browser-e2e-api.log 2>&1 &
      - name: Build and start frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8100
        run: |
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 5174 > /tmp/browser-e2e-web.log 2>&1 &
      - name: Wait for services
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8100/api/health >/dev/null && curl -fsS http://127.0.0.1:5174 >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/browser-e2e-api.log || true
          cat /tmp/browser-e2e-web.log || true
          exit 1
      - name: Run browser E2E
        run: npm run test:e2e:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
