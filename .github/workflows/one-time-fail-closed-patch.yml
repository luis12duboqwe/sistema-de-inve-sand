name: One-time production fail-closed patch

on:
  push:
    branches:
      - fix/frontend-production-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/frontend-production-fail-closed
      - name: Harden service selection and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          factory = Path('src/lib/inventoryServiceFactory.ts')
          text = factory.read_text()

          import_line = "import { getKV } from './kvStorage'"
          runtime_import = "import { isProductionApiForced } from './runtimePolicy'"
          if runtime_import not in text:
              if import_line not in text:
                  raise SystemExit('Expected kvStorage import not found')
              text = text.replace(import_line, import_line + "\n" + runtime_import, 1)

          old = """    } catch (error) {
                console.error('Error determining service type:', error)
                return new LocalServiceWrapper()
              }"""
          new = """    } catch (error) {
                console.error('Error determining service type:', error)
                if (isProductionApiForced()) {
                  return new ApiInventoryService()
                }
                return new LocalServiceWrapper()
              }"""
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected service-selection catch block not found')
          else:
              text = text.replace(old, new, 1)

          factory.write_text(text)

          test = Path('src/lib/inventoryServiceFactory.production.test.ts')
          test.write_text("""import { beforeEach, describe, expect, it, vi } from 'vitest'\n\nconst apiClientMock = vi.hoisted(() => ({\n  fetchProducts: vi.fn(),\n}))\n\nconst localServiceMock = vi.hoisted(() => ({\n  fetchProducts: vi.fn(),\n}))\n\nvi.mock('./apiClient', () => ({ apiClient: apiClientMock }))\nvi.mock('./inventoryService', () => ({ inventoryService: localServiceMock }))\nvi.mock('./kvStorage', () => ({\n  getKV: () => {\n    throw new Error('simulated service-selection failure')\n  },\n}))\nvi.mock('./runtimePolicy', () => ({\n  isProductionApiForced: () => true,\n}))\n\nimport { inventoryServiceInstance } from './inventoryServiceFactory'\n\ndescribe('inventoryServiceFactory production fail-closed policy', () => {\n  beforeEach(() => {\n    vi.clearAllMocks()\n    apiClientMock.fetchProducts.mockResolvedValue([])\n  })\n\n  it('keeps using the API when service selection fails in production', async () => {\n    await inventoryServiceInstance.fetchProducts(undefined, undefined, true)\n\n    expect(apiClientMock.fetchProducts).toHaveBeenCalledWith(undefined, undefined, true)\n    expect(localServiceMock.fetchProducts).not.toHaveBeenCalled()\n  })\n})\n""")
          PY
      - name: Commit patch to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/inventoryServiceFactory.ts src/lib/inventoryServiceFactory.production.test.ts
          git diff --cached --check
          git commit -m "fix: fail closed to API in production [auto-patch]"
          git push origin HEAD:fix/frontend-production-fail-closed
