name: Apply FAQ search keyword bound

on:
  push:
    branches:
      - fix/faq-search-keyword-bound

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/faq-search-keyword-bound
          fetch-depth: 0

      - name: Apply surgical FAQ keyword bound
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/faq.py")
          text = path.read_text()

          anchor = 'logger = logging.getLogger(__name__)\n\n\n'
          replacement = 'logger = logging.getLogger(__name__)\n\nMAX_FAQ_SEARCH_KEYWORDS = 6\n\n\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one logger anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          anchor = '        if not keywords:\n            # Fallback si todo eran stop words\n            keywords = [query.strip().lower()]\n\n        # 2. Construir condiciones OR (basta que coincida una palabra clave importante)\n'
          replacement = '        if not keywords:\n            # Fallback si todo eran stop words\n            keywords = [query.strip().lower()]\n\n        # Evitar amplificación de consultas SQL con mensajes arbitrariamente largos.\n        # El texto original no se trunca; solo se acotan las palabras que generan\n        # predicados LIKE, usando el mismo límite que la búsqueda de candidatos IA.\n        keywords = keywords[:MAX_FAQ_SEARCH_KEYWORDS]\n\n        # 2. Construir condiciones OR (basta que coincida una palabra clave importante)\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one keyword anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          if text.count('MAX_FAQ_SEARCH_KEYWORDS = 6') != 1:
              raise SystemExit("keyword bound constant guard failed")
          if text.count('keywords = keywords[:MAX_FAQ_SEARCH_KEYWORDS]') != 1:
              raise SystemExit("keyword slice guard failed")

          path.write_text(text)
          PY
          python -m compileall -q backend/app/routers/faq.py backend/tests/test_faq_search_keyword_bound.py
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-faq-keyword-bound.yml
          git config user.name "SoftMobile Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/faq.py backend/tests/test_faq_search_keyword_bound.py .github/workflows/apply-faq-keyword-bound.yml
          git diff --cached --check
          git commit -m "fix: bound FAQ search keyword expansion"
          git push origin HEAD:fix/faq-search-keyword-bound
