name: Apply restock product lock

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lock product before restock read-modify-write
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/products.py')
          text = path.read_text()
          function_start = text.index('def restock_product(\n')
          function_end = text.index('\n\n@router.post("/bulk"', function_start)
          block = text[function_start:function_end]
          old = '    product = db.query(Product).filter(Product.id == product_id).first()\n'
          new = '''    # Serialize restocks for the same product before reading stock or cost.\n    # This protects both existing-stock increments and the first Stock-row create.\n    product = (\n        db.query(Product)\n        .filter(Product.id == product_id)\n        .with_for_update()\n        .first()\n    )\n'''
          if block.count(old) != 1:
              raise SystemExit(f'expected one restock product lookup, found {block.count(old)}')
          block = block.replace(old, new, 1)
          path.write_text(text[:function_start] + block + text[function_end:])
          PY
      - name: Commit product lock
        shell: bash
        run: |
          rm .github/workflows/apply-restock-lock.yml
          git config user.name "SoftMobile Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/products.py backend/tests/test_product_restock_concurrency_integrity.py .github/workflows/apply-restock-lock.yml
          git commit -m "fix: serialize concurrent product restocks"
          git push
