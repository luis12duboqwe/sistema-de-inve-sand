name: PR110 apply purge fail-fast barrier

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Apply centralized purge lock barrier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/super_admin.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from sqlalchemy import desc, func, or_\nfrom sqlalchemy.orm import Session\n'
          new_import = 'from sqlalchemy import desc, func, or_, text\nfrom sqlalchemy.exc import OperationalError\nfrom sqlalchemy.orm import Session\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('SQLAlchemy import marker not found')

          route_marker = '@router.post("/products/{product_id}/purge")\n'
          helper = '''_PRODUCT_PURGE_WRITE_TABLES = (\n    "customers",\n    "imei_history",\n    "order_items",\n    "orders",\n    "photo_request_media",\n    "photo_requests",\n    "physical_inventory_count_items",\n    "product_imeis",\n    "purchase_receipt_items",\n    "return_items",\n    "returns",\n    "stock",\n    "stock_history",\n    "stock_transfers",\n)\n\n\ndef _is_postgres_lock_not_available(exc: OperationalError) -> bool:\n    return getattr(getattr(exc, "orig", None), "pgcode", None) == "55P03"\n\n\ndef _acquire_product_purge_lock(db: Session, product_id: int) -> Product | None:\n    \"\"\"Acquire a fail-fast destructive barrier without waiting in mixed row-lock order.\"\"\"\n    dialect_name = db.get_bind().dialect.name\n    if dialect_name == "postgresql":\n        table_list = ", ".join(f'"{name}"' for name in sorted(_PRODUCT_PURGE_WRITE_TABLES))\n        try:\n            # EXCLUSIVE conflicts with SELECT FOR UPDATE/SHARE and DML table locks,\n            # while NOWAIT guarantees purge never holds one dependency while waiting\n            # for another writer. Plain reads remain allowed.\n            db.execute(text(f"LOCK TABLE {table_list} IN EXCLUSIVE MODE NOWAIT"))\n        except OperationalError as exc:\n            if not _is_postgres_lock_not_available(exc):\n                raise\n            db.rollback()\n            raise HTTPException(\n                status_code=409,\n                detail="El producto tiene una operación de inventario en curso. Intente la purga nuevamente.",\n            ) from exc\n\n    query = db.query(Product).filter(Product.id == product_id)\n    if dialect_name == "postgresql":\n        query = query.with_for_update(nowait=True)\n    else:\n        query = query.with_for_update()\n\n    try:\n        product = query.first()\n    except OperationalError as exc:\n        if dialect_name != "postgresql" or not _is_postgres_lock_not_available(exc):\n            raise\n        db.rollback()\n        raise HTTPException(\n            status_code=409,\n            detail="El producto tiene una operación de inventario en curso. Intente la purga nuevamente.",\n        ) from exc\n\n    if product is None and dialect_name == "postgresql":\n        # Release the global destructive barrier immediately on a 404 path.\n        db.rollback()\n    return product\n\n\n'''
          if helper not in text:
              if route_marker not in text:
                  raise SystemExit('Purge route marker not found')
              text = text.replace(route_marker, helper + route_marker, 1)

          old_product = '''    # Purge participates in the same global inventory lock order as restock,\n    # receipts, counts, and transfer confirmation: Product before child Stock.\n    # A strong Product lock is appropriate here because the row itself is deleted.\n    product = (\n        db.query(Product)\n        .filter(Product.id == product_id)\n        .with_for_update()\n        .first()\n    )\n'''
          new_product = '''    # Destructive purge uses a PostgreSQL fail-fast barrier across every table it\n    # can mutate, then locks Product NOWAIT. It therefore never waits on a child\n    # row/table while holding Product (or vice versa), avoiding mixed-protocol\n    # deadlocks with restock, adjustments, orders, and transfer transitions.\n    product = _acquire_product_purge_lock(db, product_id)\n'''
          if old_product in text:
              text = text.replace(old_product, new_product, 1)
          elif new_product not in text:
              raise SystemExit('Purge Product lock block not found')

          old_counts = '        "imeis": 0,\n        "stock": 0,\n'
          new_counts = '        "imeis": 0,\n        "imei_history": 0,\n        "stock": 0,\n'
          if old_counts in text:
              text = text.replace(old_counts, new_counts, 1)
          elif new_counts not in text:
              raise SystemExit('deleted_counts marker not found')

          old_imei_delete = '        deleted_counts["imeis"] = db.query(ProductIMEI).filter(ProductIMEI.product_id == product_id).delete(synchronize_session=False)\n'
          new_imei_delete = '        deleted_counts["imei_history"] = db.query(IMEIHistory).filter(IMEIHistory.product_id == product_id).delete(synchronize_session=False)\n        deleted_counts["imeis"] = db.query(ProductIMEI).filter(ProductIMEI.product_id == product_id).delete(synchronize_session=False)\n'
          if old_imei_delete in text:
              text = text.replace(old_imei_delete, new_imei_delete, 1)
          elif new_imei_delete not in text:
              raise SystemExit('IMEI delete marker not found')

          path.write_text(text, encoding='utf-8')

          integrity_path = Path('backend/app/routers/super_admin_integrity.py')
          integrity = integrity_path.read_text(encoding='utf-8')
          old_adjust = '    product = db.query(Product).filter(Product.id == payload.product_id).first()\n'
          new_adjust = '''    # Serialize adjustments (including first-Stock-row creation) with other\n    # Product -> Stock writers before taking the target Stock lock.\n    product = (\n        db.query(Product)\n        .filter(Product.id == payload.product_id)\n        .with_for_update(key_share=True)\n        .first()\n    )\n'''
          marker = 'def adjust_stock_integrity('
          start = integrity.index(marker)
          end = integrity.index('\n\n@router.post("/orders/{order_id}/cancel")', start)
          section = integrity[start:end]
          if old_adjust in section:
              section = section.replace(old_adjust, new_adjust, 1)
              integrity = integrity[:start] + section + integrity[end:]
          elif new_adjust not in section:
              raise SystemExit('Adjustment Product lookup marker not found')
          integrity_path.write_text(integrity, encoding='utf-8')
          PY

      - name: Install focused PostgreSQL regressions
        shell: bash
        run: |
          cat > backend/tests/test_product_purge_lock_order_integrity.py <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from decimal import Decimal
          from threading import Event, Lock, get_ident
          from types import SimpleNamespace
          from uuid import uuid4

          from sqlalchemy import event
          from sqlalchemy.orm import Session, sessionmaker

          from app.models import Location, Product, Stock, StockHistory, StockTransfer
          from app.routers import products, super_admin, super_admin_integrity
          from app.routers.stock_transfer_integrity import confirm_transfer_integrity
          from app.schemas import ProductRestockRequest, StockTransferConfirm


          def _user() -> SimpleNamespace:
              return SimpleNamespace(
                  id=1,
                  username="purge-lock-compat",
                  is_superuser=True,
                  is_active=True,
                  role=None,
              )


          def _normalized(statement: str) -> str:
              return " ".join(statement.upper().split())


          def _product_and_locations(db_session: Session, *, two_locations: bool = False):
              suffix = uuid4().hex
              product = Product(
                  sku=f"PURGE-LOCK-{suffix}",
                  nombre=f"Producto Purge Lock {suffix}",
                  categoria="accesorio",
                  marca="Marca QA",
                  modelo=f"Modelo-{suffix[:8]}",
                  condicion="nuevo",
                  precio=Decimal("500.00"),
                  costo=Decimal("50.00"),
                  moneda="Lps",
                  garantia_meses=0,
                  activo=True,
                  is_serialized=False,
              )
              source = Location(nombre=f"Origen Purge {suffix}", tipo="tienda", activo=True)
              rows = [product, source]
              destination = None
              if two_locations:
                  destination = Location(nombre=f"Destino Purge {suffix}", tipo="tienda", activo=True)
                  rows.append(destination)
              db_session.add_all(rows)
              db_session.flush()
              return product, source, destination


          def _session_factory(db_session: Session):
              bind = db_session.get_bind()
              return bind, sessionmaker(autocommit=False, autoflush=False, bind=bind)


          def _purge(session, product_id: int) -> tuple[int, str]:
              try:
                  result = super_admin.purge_product_for_admin(
                      product_id,
                      super_admin.ProductPurgeRequest(reason="Prueba concurrente de purga fail-fast"),
                      session,
                      _user(),
                  )
                  return 200, str(result["ok"])
              except Exception as exc:  # noqa: BLE001 - regression captures lock contention
                  session.rollback()
                  return int(getattr(exc, "status_code", 500)), repr(exc)


          def test_purge_fails_fast_when_restock_holds_product(db_session: Session) -> None:
              product, location, _ = _product_and_locations(db_session)
              product_id = int(product.id)
              location_id = int(location.id)
              db_session.add(Stock(product_id=product_id, location_id=location_id, cantidad_disponible=10))
              db_session.commit()

              bind, SessionLocal = _session_factory(db_session)
              state_lock = Lock()
              roles: dict[int, str] = {}
              restock_product_locked = Event()
              purge_finished = Event()

              def after_cursor_execute(conn, cursor, statement, parameters, context, executemany):
                  normalized = _normalized(statement)
                  with state_lock:
                      role = roles.get(get_ident())
                  if (
                      role == "restock"
                      and normalized.startswith("SELECT")
                      and "FROM PRODUCTS" in normalized
                      and "FOR NO KEY UPDATE" in normalized
                  ):
                      restock_product_locked.set()
                      purge_finished.wait(timeout=10)

              event.listen(bind, "after_cursor_execute", after_cursor_execute)

              def run_restock():
                  session = SessionLocal()
                  with state_lock:
                      roles[get_ident()] = "restock"
                  try:
                      result = products.restock_product(
                          product_id,
                          ProductRestockRequest(location_id=location_id, cantidad=2, costo_unitario=Decimal("100.00")),
                          session,
                          _user(),
                      )
                      return 200, str(result.costo)
                  finally:
                      with state_lock:
                          roles.pop(get_ident(), None)
                      session.close()

              def run_purge():
                  session = SessionLocal()
                  try:
                      assert restock_product_locked.wait(timeout=10)
                      return _purge(session, product_id)
                  finally:
                      purge_finished.set()
                      session.close()

              try:
                  with ThreadPoolExecutor(max_workers=2) as pool:
                      restock_future = pool.submit(run_restock)
                      purge_future = pool.submit(run_purge)
                      restock_result = restock_future.result(timeout=20)
                      purge_result = purge_future.result(timeout=20)
              finally:
                  event.remove(bind, "after_cursor_execute", after_cursor_execute)

              assert restock_result[0] == 200
              assert purge_result[0] == 409
              db_session.expire_all()
              persisted = db_session.query(Stock).filter(Stock.product_id == product_id, Stock.location_id == location_id).one()
              assert persisted.cantidad_disponible == 12
              assert db_session.get(Product, product_id) is not None


          def test_purge_fails_fast_when_adjustment_holds_stock(db_session: Session) -> None:
              product, location, _ = _product_and_locations(db_session)
              product_id = int(product.id)
              location_id = int(location.id)
              db_session.add(Stock(product_id=product_id, location_id=location_id, cantidad_disponible=10))
              db_session.commit()

              bind, SessionLocal = _session_factory(db_session)
              state_lock = Lock()
              roles: dict[int, str] = {}
              adjustment_stock_locked = Event()
              purge_finished = Event()

              def after_cursor_execute(conn, cursor, statement, parameters, context, executemany):
                  normalized = _normalized(statement)
                  with state_lock:
                      role = roles.get(get_ident())
                  if (
                      role == "adjust"
                      and normalized.startswith("SELECT")
                      and "FROM STOCK " in normalized
                      and "FOR UPDATE" in normalized
                  ):
                      adjustment_stock_locked.set()
                      purge_finished.wait(timeout=10)

              event.listen(bind, "after_cursor_execute", after_cursor_execute)

              def run_adjustment():
                  session = SessionLocal()
                  with state_lock:
                      roles[get_ident()] = "adjust"
                  try:
                      result = super_admin_integrity.adjust_stock_integrity(
                          super_admin.StockAdjustmentRequest(
                              product_id=product_id,
                              location_id=location_id,
                              cantidad_disponible=18,
                              cantidad_reservada=0,
                              cantidad_defectuosa=0,
                              reason="Ajuste concurrente para prueba",
                          ),
                          session,
                          _user(),
                      )
                      return 200, str(result["cantidad_disponible"])
                  finally:
                      with state_lock:
                          roles.pop(get_ident(), None)
                      session.close()

              def run_purge():
                  session = SessionLocal()
                  try:
                      assert adjustment_stock_locked.wait(timeout=10)
                      return _purge(session, product_id)
                  finally:
                      purge_finished.set()
                      session.close()

              try:
                  with ThreadPoolExecutor(max_workers=2) as pool:
                      adjust_future = pool.submit(run_adjustment)
                      purge_future = pool.submit(run_purge)
                      adjust_result = adjust_future.result(timeout=20)
                      purge_result = purge_future.result(timeout=20)
              finally:
                  event.remove(bind, "after_cursor_execute", after_cursor_execute)

              assert adjust_result[0] == 200
              assert purge_result[0] == 409
              db_session.expire_all()
              stock = db_session.query(Stock).filter(Stock.product_id == product_id, Stock.location_id == location_id).one()
              assert stock.cantidad_disponible == 18
              assert db_session.query(StockHistory).filter(
                  StockHistory.product_id == product_id,
                  StockHistory.tipo_cambio == "super_admin_adjustment",
              ).count() == 1


          def test_purge_fails_fast_when_transfer_transition_holds_transfer(db_session: Session) -> None:
              product, source, destination = _product_and_locations(db_session, two_locations=True)
              assert destination is not None
              product_id = int(product.id)
              source_id = int(source.id)
              destination_id = int(destination.id)
              db_session.add_all([
                  Stock(product_id=product_id, location_id=source_id, cantidad_disponible=10, cantidad_reservada=3),
                  Stock(product_id=product_id, location_id=destination_id, cantidad_disponible=5),
              ])
              transfer = StockTransfer(
                  product_id=product_id,
                  from_location_id=source_id,
                  to_location_id=destination_id,
                  cantidad=3,
                  estado="pendiente",
                  created_by="purge-lock-compat",
              )
              db_session.add(transfer)
              db_session.commit()
              transfer_id = int(transfer.id)

              bind, SessionLocal = _session_factory(db_session)
              state_lock = Lock()
              roles: dict[int, str] = {}
              transfer_locked = Event()
              purge_finished = Event()

              def after_cursor_execute(conn, cursor, statement, parameters, context, executemany):
                  normalized = _normalized(statement)
                  with state_lock:
                      role = roles.get(get_ident())
                  if (
                      role == "confirm"
                      and normalized.startswith("SELECT")
                      and "FROM STOCK_TRANSFERS" in normalized
                      and "FOR UPDATE" in normalized
                  ):
                      transfer_locked.set()
                      purge_finished.wait(timeout=10)

              event.listen(bind, "after_cursor_execute", after_cursor_execute)

              def run_confirmation():
                  session = SessionLocal()
                  with state_lock:
                      roles[get_ident()] = "confirm"
                  try:
                      result = confirm_transfer_integrity(
                          transfer_id,
                          StockTransferConfirm(received_quantity=3),
                          db=session,
                          current_user=_user(),
                      )
                      return 200, str(result.estado)
                  finally:
                      with state_lock:
                          roles.pop(get_ident(), None)
                      session.close()

              def run_purge():
                  session = SessionLocal()
                  try:
                      assert transfer_locked.wait(timeout=10)
                      return _purge(session, product_id)
                  finally:
                      purge_finished.set()
                      session.close()

              try:
                  with ThreadPoolExecutor(max_workers=2) as pool:
                      confirm_future = pool.submit(run_confirmation)
                      purge_future = pool.submit(run_purge)
                      confirm_result = confirm_future.result(timeout=20)
                      purge_result = purge_future.result(timeout=20)
              finally:
                  event.remove(bind, "after_cursor_execute", after_cursor_execute)

              assert confirm_result[0] == 200
              assert purge_result[0] == 409
              db_session.expire_all()
              persisted_transfer = db_session.get(StockTransfer, transfer_id)
              assert persisted_transfer is not None
              assert persisted_transfer.estado == "confirmada"
              source_stock = db_session.query(Stock).filter(Stock.product_id == product_id, Stock.location_id == source_id).one()
              destination_stock = db_session.query(Stock).filter(Stock.product_id == product_id, Stock.location_id == destination_id).one()
              assert source_stock.cantidad_disponible == 7
              assert source_stock.cantidad_reservada == 0
              assert destination_stock.cantidad_disponible == 8
          PY

          python -m compileall -q backend/app/routers/super_admin.py backend/app/routers/super_admin_integrity.py backend/tests/test_product_purge_lock_order_integrity.py
          git diff --check

      - name: Commit targeted fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/super_admin.py backend/app/routers/super_admin_integrity.py backend/tests/test_product_purge_lock_order_integrity.py
          git commit -m "fix: make product purge fail fast on inventory contention"
          git push origin HEAD:fix/restock-concurrency-integrity
