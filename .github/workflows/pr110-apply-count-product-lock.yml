name: PR110 apply inventory-count product lock

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Apply targeted count approval lock fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/multistore_control.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:\n        for item in count.items:\n            product = db.query(Product).filter(Product.id == item.product_id).first()\n            stock = _stock_for_update(db, item.product_id, count.location_id)\n'''
          new = '''    try:\n        # Align physical-count approval with every inventory writer that can create\n        # a missing Stock row. Lock all involved Products first, in ascending ID\n        # order, so a missing (product, location) Stock key is serialized before\n        # either this approval or transfer/restock treats it as absent. PostgreSQL\n        # FOR NO KEY UPDATE also remains compatible with StockHistory FK KEY SHARE.\n        product_ids = sorted({int(item.product_id) for item in count.items})\n        locked_products = (\n            db.query(Product)\n            .filter(Product.id.in_(product_ids))\n            .order_by(Product.id.asc())\n            .with_for_update(key_share=True)\n            .all()\n        )\n        locked_products_by_id = {int(product.id): product for product in locked_products}\n\n        for item in count.items:\n            product = locked_products_by_id.get(int(item.product_id))\n            stock = _stock_for_update(db, item.product_id, count.location_id)\n'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one approval loop, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied inventory-count Product locking protocol.')
          elif new in text:
              print('Targeted fix already present.')
          else:
              raise SystemExit('Approval loop marker not found; refusing unrelated changes.')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m compileall -q backend/app/routers/multistore_control.py
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/multistore_control.py
          git commit -m "fix: serialize missing stock during count approval"
          git push origin HEAD:fix/restock-concurrency-integrity
