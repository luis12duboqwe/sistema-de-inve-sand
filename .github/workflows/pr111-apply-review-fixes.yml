name: PR111 apply review fixes

on:
  push:
    branches:
      - fix/supplier-identity-unicode-index-integrity

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/supplier-identity-unicode-index-integrity
          fetch-depth: 0

      - name: Apply targeted supplier integrity fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations_path = Path('backend/app/utils/auto_migrations.py')
          text = migrations_path.read_text(encoding='utf-8')

          function_name = '_apply_supplier_unicode_safety_revalidation_migration'
          if function_name not in text:
              marker = '\ndef _apply_location_name_uniqueness_migration() -> None:\n'
              if marker not in text:
                  raise SystemExit('Supplier revalidation insertion marker not found')
              function = '''\n\ndef _apply_supplier_unicode_safety_revalidation_migration() -> None:\n    """Revalidate historical supplier names under the hardened Unicode policy."""\n    if "suppliers" not in inspect(database.engine).get_table_names():\n        return\n\n    with database.engine.connect() as conn:\n        rows = conn.execute(\n            text("SELECT id, nombre FROM suppliers ORDER BY id")\n        ).mappings().all()\n\n    for row in rows:\n        supplier_id = int(row["id"])\n        raw_name = str(row["nombre"] or "")\n        try:\n            supplier_name_key(raw_name)\n        except ValueError as exc:\n            raise RuntimeError(\n                f"Proveedor existente ID {supplier_id} tiene un nombre inválido; "\n                "corrígelo antes de continuar la migración"\n            ) from exc\n'''
              text = text.replace(marker, function + marker, 1)

          migration_line = '    ("20260907_01_supplier_unicode_safety_revalidation", _apply_supplier_unicode_safety_revalidation_migration),\n'
          if migration_line not in text:
              marker = '    ("20260825_01_supplier_name_uniqueness", _apply_supplier_name_uniqueness_migration),\n'
              if marker not in text:
                  raise SystemExit('Supplier migration registry marker not found')
              text = text.replace(marker, marker + migration_line, 1)

          old_checker = '''def _supplier_unique_index_exists() -> bool:\n    inspector = inspect(database.engine)\n    if "suppliers" not in inspector.get_table_names():\n        return True\n\n    return any(\n        str(index.get("name") or "") == "ix_suppliers_nombre_key_hash"\n        and bool(index.get("unique"))\n        and list(index.get("column_names") or []) == ["nombre_key_hash"]\n        for index in inspector.get_indexes("suppliers")\n    )\n'''
          new_checker = '''def _supplier_unique_index_exists() -> bool:\n    inspector = inspect(database.engine)\n    if "suppliers" not in inspector.get_table_names():\n        return True\n\n    for index in inspector.get_indexes("suppliers"):\n        dialect_options = index.get("dialect_options") or {}\n        is_partial = (\n            dialect_options.get("postgresql_where") is not None\n            or dialect_options.get("sqlite_where") is not None\n        )\n        if (\n            str(index.get("name") or "") == "ix_suppliers_nombre_key_hash"\n            and bool(index.get("unique"))\n            and list(index.get("column_names") or []) == ["nombre_key_hash"]\n            and not is_partial\n        ):\n            return True\n    return False\n'''
          if old_checker in text:
              text = text.replace(old_checker, new_checker, 1)
          elif new_checker not in text:
              raise SystemExit('Supplier index checker marker not found')

          migrations_path.write_text(text, encoding='utf-8')

          tests_path = Path('backend/tests/test_supplier_name_concurrency_integrity.py')
          tests = tests_path.read_text(encoding='utf-8')
          import_marker = 'import app.database as database\n'
          if 'import app.utils.auto_migrations as auto_migrations\n' not in tests:
              if import_marker not in tests:
                  raise SystemExit('Test import marker not found')
              tests = tests.replace(
                  import_marker,
                  import_marker + 'import app.utils.auto_migrations as auto_migrations\n',
                  1,
              )

          sentinel = 'def test_supplier_unicode_revalidation_rejects_already_migrated_unsafe_name('
          if sentinel not in tests:
              tests += '''\n\n\ndef test_supplier_unicode_revalidation_rejects_already_migrated_unsafe_name(\n    tmp_path,\n    monkeypatch,\n) -> None:\n    db_path = tmp_path / "supplier-already-migrated-invisible.db"\n    engine = create_engine(f"sqlite:///{db_path}")\n    _create_legacy_sqlite_schema(engine, [(1, "Proveedor\\u200bCentral")])\n    with engine.begin() as conn:\n        conn.execute(text("ALTER TABLE suppliers ADD COLUMN nombre_normalized TEXT"))\n        conn.execute(text("ALTER TABLE suppliers ADD COLUMN nombre_key_hash VARCHAR(64)"))\n        conn.execute(\n            text(\n                "UPDATE suppliers SET nombre_normalized = :normalized, "\n                "nombre_key_hash = :digest WHERE id = 1"\n            ),\n            {\n                "normalized": "proveedor\\u200bcentral",\n                "digest": "0" * 64,\n            },\n        )\n        conn.execute(\n            text(\n                "CREATE UNIQUE INDEX ix_suppliers_nombre_key_hash "\n                "ON suppliers (nombre_key_hash)"\n            )\n        )\n        conn.execute(\n            text(\n                "CREATE TABLE schema_migrations ("\n                "id VARCHAR(100) PRIMARY KEY, "\n                "applied_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP)"\n            )\n        )\n        conn.execute(\n            text("INSERT INTO schema_migrations (id) VALUES (:migration_id)"),\n            {"migration_id": "20260825_01_supplier_name_uniqueness"},\n        )\n    monkeypatch.setattr(database, "engine", engine)\n\n    try:\n        with pytest.raises(RuntimeError, match="nombre inválido"):\n            run_auto_migrations()\n\n        with engine.connect() as conn:\n            applied = {\n                str(row[0])\n                for row in conn.execute(text("SELECT id FROM schema_migrations"))\n            }\n        assert "20260825_01_supplier_name_uniqueness" in applied\n        assert "20260907_01_supplier_unicode_safety_revalidation" not in applied\n    finally:\n        engine.dispose()\n\n\ndef test_supplier_schema_rejects_correctly_named_partial_unique_index(\n    tmp_path,\n    monkeypatch,\n) -> None:\n    db_path = tmp_path / "supplier-partial-index.db"\n    engine = create_engine(f"sqlite:///{db_path}")\n    _create_legacy_sqlite_schema(engine, [(1, "Proveedor Central")])\n    with engine.begin() as conn:\n        conn.execute(text("ALTER TABLE suppliers ADD COLUMN nombre_key_hash VARCHAR(64)"))\n        conn.execute(\n            text(\n                "CREATE UNIQUE INDEX ix_suppliers_nombre_key_hash "\n                "ON suppliers (nombre_key_hash) WHERE activo = 1"\n            )\n        )\n    monkeypatch.setattr(database, "engine", engine)\n\n    try:\n        with pytest.raises(\n            RuntimeError,\n            match="falta índice único ix_suppliers_nombre_key_hash",\n        ):\n            run_auto_migrations()\n\n        with engine.connect() as conn:\n            index_rows = conn.execute(text("PRAGMA index_list('suppliers')")).fetchall()\n        matching = [\n            row for row in index_rows\n            if str(row[1]) == "ix_suppliers_nombre_key_hash"\n        ]\n        assert len(matching) == 1\n        assert bool(matching[0][2])\n        assert bool(matching[0][4])\n    finally:\n        engine.dispose()\n\n\n@pytest.mark.parametrize("where_key", ["postgresql_where", "sqlite_where"])\ndef test_supplier_unique_index_metadata_rejects_partial_predicates(\n    monkeypatch,\n    where_key: str,\n) -> None:\n    fake_inspector = SimpleNamespace(\n        get_table_names=lambda: ["suppliers"],\n        get_indexes=lambda table: [\n            {\n                "name": "ix_suppliers_nombre_key_hash",\n                "unique": True,\n                "column_names": ["nombre_key_hash"],\n                "dialect_options": {where_key: "activo = 1"},\n            }\n        ],\n    )\n    monkeypatch.setattr(auto_migrations, "inspect", lambda engine: fake_inspector)\n\n    assert auto_migrations._supplier_unique_index_exists() is False\n'''

          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m compileall -q backend/app/utils/auto_migrations.py backend/tests/test_supplier_name_concurrency_integrity.py
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/utils/auto_migrations.py backend/tests/test_supplier_name_concurrency_integrity.py
          git commit -m "fix: close supplier identity review gaps"
          git push origin HEAD:fix/supplier-identity-unicode-index-integrity
