name: One-shot deterministic receipt lock test

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply deterministic lock-order regression patch
        run: python .github/patch_reversed_receipt_lock_test.py
      - name: Commit patch and remove temporary helpers
        run: |
          rm .github/patch_reversed_receipt_lock_test.py
          rm .github/workflows/one-shot-deterministic-receipt-lock-test.yml
          git config user.name 'SoftMobile Integrity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/tests/test_purchase_restock_lock_order_integrity.py .github/patch_reversed_receipt_lock_test.py .github/workflows/one-shot-deterministic-receipt-lock-test.yml
          git commit -m 'test: prove deterministic purchase lock ordering'
          git push origin HEAD:fix/restock-concurrency-integrity
