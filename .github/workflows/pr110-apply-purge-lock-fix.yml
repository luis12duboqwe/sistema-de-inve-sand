name: PR110 apply purge lock fix

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Apply purge lock fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router_path = Path('backend/app/routers/super_admin.py')
          text = router_path.read_text(encoding='utf-8')
          function_marker = 'def purge_product_for_admin('
          start = text.index(function_marker)
          next_route = text.index('\n\n@router.patch("/products/{product_id}")', start)
          section = text[start:next_route]
          old = '    product = db.query(Product).filter(Product.id == product_id).first()\n'
          new = '''    # Purge participates in the same global inventory lock order as restock,\n    # receipts, counts, and transfer confirmation: Product before child Stock.\n    # A strong Product lock is appropriate here because the row itself is deleted.\n    product = (\n        db.query(Product)\n        .filter(Product.id == product_id)\n        .with_for_update()\n        .first()\n    )\n'''
          if old in section:
              section = section.replace(old, new, 1)
              text = text[:start] + section + text[next_route:]
              router_path.write_text(text, encoding='utf-8')
              print('Applied Product-first purge locking.')
          elif new in section:
              print('Purge locking fix already present.')
          else:
              raise SystemExit('Purge Product lookup marker not found; refusing unrelated changes.')

          test_path = Path('backend/tests/test_product_purge_lock_order_integrity.py')
          test_content = '''from concurrent.futures import ThreadPoolExecutor\nfrom decimal import Decimal\nfrom threading import Event, Lock, get_ident\nfrom time import monotonic, sleep\nfrom types import SimpleNamespace\nfrom uuid import uuid4\n\nfrom sqlalchemy import event\nfrom sqlalchemy.orm import Session, sessionmaker\n\nfrom app.models import Location, Product, Stock\nfrom app.routers import products, super_admin\nfrom app.schemas import ProductRestockRequest\n\n\ndef _user() -> SimpleNamespace:\n    return SimpleNamespace(\n        id=1,\n        username="purge-lock-compat",\n        is_superuser=True,\n        is_active=True,\n        role=None,\n    )\n\n\ndef _normalized(statement: str) -> str:\n    return " ".join(statement.upper().split())\n\n\ndef test_product_purge_locks_product_before_stock_against_restock(\n    db_session: Session,\n) -> None:\n    suffix = uuid4().hex\n    location = Location(\n        nombre=f"Tienda Purge Lock {suffix}",\n        tipo="tienda",\n        activo=True,\n    )\n    product = Product(\n        sku=f"PURGE-LOCK-{suffix}",\n        nombre=f"Producto Purge Lock {suffix}",\n        categoria="accesorio",\n        marca="Marca QA",\n        modelo=f"Modelo-{suffix[:8]}",\n        condicion="nuevo",\n        precio=Decimal("500.00"),\n        costo=Decimal("50.00"),\n        moneda="Lps",\n        garantia_meses=0,\n        activo=True,\n        is_serialized=False,\n    )\n    db_session.add_all([location, product])\n    db_session.flush()\n    product_id = int(product.id)\n    location_id = int(location.id)\n    db_session.add(\n        Stock(\n            product_id=product_id,\n            location_id=location_id,\n            cantidad_disponible=10,\n            cantidad_reservada=0,\n            cantidad_defectuosa=0,\n        )\n    )\n    db_session.commit()\n\n    bind = db_session.get_bind()\n    SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=bind)\n    state_lock = Lock()\n    thread_roles: dict[int, str] = {}\n    restock_product_locked = Event()\n    purge_product_lock_attempted = Event()\n    purge_stock_delete_attempted = Event()\n    purge_product_lock_sql: list[str] = []\n\n    def before_cursor_execute(conn, cursor, statement, parameters, context, executemany):\n        normalized = _normalized(statement)\n        thread_id = get_ident()\n        with state_lock:\n            role = thread_roles.get(thread_id)\n        if role != "purge":\n            return\n\n        if (\n            normalized.startswith("SELECT")\n            and "FROM PRODUCTS" in normalized\n            and "FOR UPDATE" in normalized\n        ):\n            with state_lock:\n                purge_product_lock_sql.append(normalized)\n            purge_product_lock_attempted.set()\n            return\n\n        if normalized.startswith("DELETE FROM STOCK "):\n            purge_stock_delete_attempted.set()\n\n    def after_cursor_execute(conn, cursor, statement, parameters, context, executemany):\n        normalized = _normalized(statement)\n        thread_id = get_ident()\n        with state_lock:\n            role = thread_roles.get(thread_id)\n        if not (\n            role == "restock"\n            and normalized.startswith("SELECT")\n            and "FROM PRODUCTS" in normalized\n            and "FOR NO KEY UPDATE" in normalized\n        ):\n            return\n\n        restock_product_locked.set()\n        deadline = monotonic() + 5\n        while monotonic() < deadline:\n            if purge_product_lock_attempted.is_set() or purge_stock_delete_attempted.is_set():\n                return\n            sleep(0.01)\n        raise AssertionError("Purge never attempted Product or Stock while restock held Product")\n\n    event.listen(bind, "before_cursor_execute", before_cursor_execute)\n    event.listen(bind, "after_cursor_execute", after_cursor_execute)\n\n    def run_restock() -> tuple[int, str]:\n        session = SessionLocal()\n        thread_id = get_ident()\n        with state_lock:\n            thread_roles[thread_id] = "restock"\n        try:\n            try:\n                result = products.restock_product(\n                    product_id,\n                    ProductRestockRequest(\n                        location_id=location_id,\n                        cantidad=2,\n                        costo_unitario=Decimal("100.00"),\n                    ),\n                    session,\n                    _user(),\n                )\n                return 200, str(result.costo)\n            except Exception as exc:  # noqa: BLE001 - regression captures DB deadlocks\n                session.rollback()\n                return int(getattr(exc, "status_code", 500)), repr(exc)\n        finally:\n            with state_lock:\n                thread_roles.pop(thread_id, None)\n            session.close()\n\n    def run_purge() -> tuple[int, str]:\n        session = SessionLocal()\n        thread_id = get_ident()\n        with state_lock:\n            thread_roles[thread_id] = "purge"\n        try:\n            if not restock_product_locked.wait(timeout=10):\n                return 500, "restock never acquired Product lock"\n            try:\n                result = super_admin.purge_product_for_admin(\n                    product_id,\n                    super_admin.ProductPurgeRequest(\n                        reason="Prueba concurrente de orden Product antes de Stock"\n                    ),\n                    session,\n                    _user(),\n                )\n                return 200, str(result["ok"])\n            except Exception as exc:  # noqa: BLE001 - regression captures DB deadlocks\n                session.rollback()\n                return int(getattr(exc, "status_code", 500)), repr(exc)\n        finally:\n            with state_lock:\n                thread_roles.pop(thread_id, None)\n            session.close()\n\n    try:\n        with ThreadPoolExecutor(max_workers=2) as pool:\n            restock_future = pool.submit(run_restock)\n            purge_future = pool.submit(run_purge)\n            results = [\n                restock_future.result(timeout=20),\n                purge_future.result(timeout=20),\n            ]\n    finally:\n        event.remove(bind, "before_cursor_execute", before_cursor_execute)\n        event.remove(bind, "after_cursor_execute", after_cursor_execute)\n\n    assert sorted(status for status, _ in results) == [200, 200]\n    assert purge_product_lock_attempted.is_set()\n    assert purge_product_lock_sql\n    assert purge_stock_delete_attempted.is_set()\n\n    db_session.expire_all()\n    assert db_session.query(Product).filter(Product.id == product_id).count() == 0\n    assert db_session.query(Stock).filter(Stock.product_id == product_id).count() == 0\n'''
          if test_path.exists():
              current = test_path.read_text(encoding='utf-8')
              if current != test_content:
                  raise SystemExit('Regression file exists with unexpected content.')
          else:
              test_path.write_text(test_content, encoding='utf-8')
              print('Added purge/restock PostgreSQL lock regression.')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m compileall -q backend/app/routers/super_admin.py backend/tests/test_product_purge_lock_order_integrity.py
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/super_admin.py backend/tests/test_product_purge_lock_order_integrity.py
          git commit -m "fix: lock product before destructive purge"
          git push origin HEAD:fix/restock-concurrency-integrity
