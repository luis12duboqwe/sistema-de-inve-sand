name: PR110 apply transfer lock fix

on:
  push:
    branches:
      - fix/restock-concurrency-integrity

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-concurrency-integrity
          fetch-depth: 0

      - name: Apply targeted transfer lock fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/stock_transfers.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Validar entidades base\n    product = validate_product_exists(db, transfer.product_id)\n    from_location = validate_location_exists(db, transfer.from_location_id)\n    require_location_access(db, current_user, from_location.id, "can_edit")\n    to_location = validate_location_exists(db, transfer.to_location_id)\n    \n    # Validar stock en ubicación de origen\n    source_stock = db.query(Stock).filter(\n        Stock.product_id == transfer.product_id,\n        Stock.location_id == transfer.from_location_id\n    ).with_for_update().first()\n    \n    if not source_stock:\n        raise HTTPException(\n            status_code=400,\n            detail="Stock de origen no encontrado"\n        )\n'''
          new = '''    # Validar entidades base y alinear el protocolo de bloqueo con restock.\n    # Product FOR NO KEY UPDATE serializa escritores de costo/stock sin bloquear\n    # los KEY SHARE de historiales; luego todas las filas Stock involucradas se\n    # adquieren en orden determinista para evitar ciclos origen/destino.\n    product = (\n        db.query(Product)\n        .filter(Product.id == transfer.product_id, Product.activo == True)\n        .with_for_update(key_share=True)\n        .first()\n    )\n    if not product:\n        raise HTTPException(\n            status_code=404,\n            detail=f"Producto con ID {transfer.product_id} no encontrado o inactivo"\n        )\n\n    from_location = validate_location_exists(db, transfer.from_location_id)\n    require_location_access(db, current_user, from_location.id, "can_edit")\n    to_location = validate_location_exists(db, transfer.to_location_id)\n\n    involved_location_ids = sorted({\n        int(transfer.from_location_id),\n        int(transfer.to_location_id),\n    })\n    locked_stocks = (\n        db.query(Stock)\n        .filter(\n            Stock.product_id == transfer.product_id,\n            Stock.location_id.in_(involved_location_ids),\n        )\n        .order_by(Stock.location_id.asc(), Stock.id.asc())\n        .with_for_update()\n        .all()\n    )\n    source_stock = next(\n        (\n            stock_item\n            for stock_item in locked_stocks\n            if stock_item.location_id == transfer.from_location_id\n        ),\n        None,\n    )\n\n    if not source_stock:\n        raise HTTPException(\n            status_code=400,\n            detail="Stock de origen no encontrado"\n        )\n'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one target block, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied transfer Product -> ordered Stock locking fix.')
          elif new in text:
              print('Targeted fix already present.')
          else:
              raise SystemExit('Target block not found; refusing unrelated changes.')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m compileall -q backend/app/routers/stock_transfers.py
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/stock_transfers.py
          git commit -m "fix: order transfer confirmation stock locks"
          git push origin HEAD:fix/restock-concurrency-integrity
