name: CI

on:
  push:
    branches: [ main, ghttt, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - name: Validate deploy shell scripts
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Test off-site backup verifier
        run: bash deploy/test-verify-offsite-backup.sh
      - name: Test off-site healthcheck deadline
        run: bash deploy/test-ops-healthcheck-timeout.sh
      - name: Test DR drill hardening
        run: bash deploy/test-dr-drill.sh

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      ENVIRONMENT: testing
      DEBUG: 'true'
      DATABASE_URL: postgresql+psycopg2://inventory_test:inventory_test_password@127.0.0.1:5432/inventory_test
      ALLOWED_HOSTS: '*'
      CORS_ORIGINS: http://testserver,http://127.0.0.1:8001
      SENTRY_DISABLED: 'true'
      ENABLE_AI_FEATURES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run backend tests against PostgreSQL
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing -ra

  e2e-api-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install runtime deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run SQLite compatibility E2E tests
        run: |
          pytest -q tests/e2e/test_runtime_e2e.py tests/e2e/test_business_flows_e2e.py

  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_e2e
          POSTGRES_USER: inventory_e2e
          POSTGRES_PASSWORD: inventory_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_e2e -d inventory_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgresql+psycopg2://inventory_e2e:inventory_e2e_password@127.0.0.1:5432/inventory_e2e
      ENVIRONMENT: testing
      DEBUG: 'true'
      ALLOWED_HOSTS: '*'
      CORS_ORIGINS: http://127.0.0.1
      SENTRY_DISABLED: 'true'
      ENABLE_AI_FEATURES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run real PostgreSQL E2E and concurrency test
        run: pytest -q tests/e2e/test_postgres_runtime_e2e.py

  security-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan npm dependencies
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
      - name: Scan python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt

  security-container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull --no-cache -t inventory-backend:ci ./backend
      - name: Build frontend image
        run: docker build --pull --no-cache -t inventory-frontend:ci -f Dockerfile.frontend .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  patch-sale-completion-ui:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/final-business-integrity-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-business-integrity-hardening
          fetch-depth: 0
      - name: Patch only the obsolete completion-code helper
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const getCompletionValidationCode = async (newStatus: OrderWithItems['estado']): Promise<string | undefined | null> => {
            if (!useAPI || newStatus !== 'completada') return undefined

            try {
              const config = await apiClient.getDailyCloseConfig()
              if (!config.configured) return undefined
            } catch (error) {
              console.error('Error checking daily close validation config:', error)
              toast.error('No se pudo verificar el código de validación')
              return null
            }

            return new Promise(resolve => {
              setValidationCodeRequest({
                title: 'Validar venta',
                description: 'Ingrese el código configurado para completar y validar esta venta.',
                resolve,
              })
            })
          }
"""
          new = """  const getCompletionValidationCode = async (_newStatus: OrderWithItems['estado']): Promise<undefined> => {
            // Completar la venta y validar el cierre son operaciones separadas.
            // El código se solicita únicamente desde el flujo explícito de Cierre de Día.
            return undefined
          }
"""
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one legacy completion validation block')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Restore CI definition, remove temporary workflow and commit App change
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/one-shot-sale-completion-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/ci.yml .github/workflows/one-shot-sale-completion-ui.yml
          git commit -m "Stop requesting daily-close code when completing sales"
          git push origin HEAD:fix/final-business-integrity-hardening
