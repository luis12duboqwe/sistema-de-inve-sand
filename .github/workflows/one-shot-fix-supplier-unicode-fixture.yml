name: One-shot fix supplier Unicode fixture

on:
  push:
    branches:
      - fix/supplier-identity-unicode-index-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/supplier-identity-unicode-index-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply real Unicode fixture fix
        run: python .github/fix_supplier_unicode_fixture.py
      - name: Commit fix and remove temporary helpers
        run: |
          rm .github/fix_supplier_unicode_fixture.py
          rm .github/workflows/one-shot-fix-supplier-unicode-fixture.yml
          git config user.name 'SoftMobile Integrity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/tests/test_supplier_name_concurrency_integrity.py .github/fix_supplier_unicode_fixture.py .github/workflows/one-shot-fix-supplier-unicode-fixture.yml
          git commit -m 'test: use real invisible Unicode supplier fixtures'
          git push origin HEAD:fix/supplier-identity-unicode-index-integrity
