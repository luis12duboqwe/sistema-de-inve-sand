name: Patch NewOrder USD pricing

on:
  push:
    branches:
      - agent/price-policy-hardening
    paths:
      - .github/workflows/patch-neworder-usd.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/price-policy-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply narrowly scoped USD/HNL POS patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/NewOrderDialog.tsx')
          text = path.read_text(encoding='utf-8')

          anchor = """  const selectedSalesProfile = salesProfiles.find(profile => profile.slug === salesProfileSlug)\n"""
          helper = """  const selectedSalesProfile = salesProfiles.find(profile => profile.slug === salesProfileSlug)\n\n  const getExchangeRate = () => {\n    const rawRate = selectedSalesProfile?.configuracion?.exchange_rate\n    const parsedRate = parseFlexibleNumber(rawRate)\n    return parsedRate !== null && parsedRate > 0 ? parsedRate : 25\n  }\n\n  const getCatalogPriceHnl = (product: ProductWithStock) => {\n    const catalogPrice = parseFlexibleNumber(product.precio) ?? 0\n    const currency = String(product.moneda ?? '').trim().toUpperCase()\n    if (currency === 'USD' || currency === 'US$' || currency === '$') {\n      return Number((catalogPrice * getExchangeRate()).toFixed(2))\n    }\n    return catalogPrice\n  }\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected selectedSalesProfile anchor once, found {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          replacements = [
              (
                  "const currentPrice = parseFlexibleNumber(product.precio) ?? 0",
                  "const currentPrice = getCatalogPriceHnl(product)",
                  1,
              ),
              (
                  "const unitPrice = Number(item.precio_unitario ?? product.precio) || 0",
                  "const unitPrice = Number(item.precio_unitario ?? getCatalogPriceHnl(product)) || 0",
                  1,
              ),
              (
                  "precio_unitario: parseFlexibleNumber(selectedProduct.precio),",
                  "precio_unitario: getCatalogPriceHnl(selectedProduct),",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {old!r} {expected} time(s), found {count}')
              text = text.replace(old, new, expected)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-neworder-usd.yml
          git config user.name "inventory-hardening-bot"
          git config user.email "inventory-hardening-bot@users.noreply.github.com"
          git add src/components/NewOrderDialog.tsx .github/workflows/patch-neworder-usd.yml
          git diff --cached --check
          git commit -m "Normalize USD catalog prices in NewOrder POS"
          git push origin HEAD:agent/price-policy-hardening
