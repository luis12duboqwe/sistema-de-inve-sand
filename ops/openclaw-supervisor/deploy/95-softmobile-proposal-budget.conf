[Service]
# Overrides the development-wide unlimited flag for this proposal-only job.
# The wrapper allows at most four Groq proposal calls per UTC day.
ExecStart=
ExecStart=/usr/local/sbin/softmobile-qa-cap /usr/bin/python3 /opt/openclaw-lab/supervisor/patch_proposer_capped.py
TimeoutStartSec=150
MemoryMax=384M
